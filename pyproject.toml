[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queris"
version = "0.1.0"
description = "Evaluated Text-to-SQL analytics agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Steven Ortega" }]
dependencies = [
  "duckdb>=1.0",
  "openai>=2.0",
  "pydantic>=2.0",
  "sqlglot>=25.0",
]

[project.scripts]
queris-sample-data = "queris.sample_data:main"
queris-schema = "queris.schema:main"

[project.optional-dependencies]
dev = [
  "pre-commit>=3.0",
  "pytest>=8.0",
  "ruff==0.15.18",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["src"]

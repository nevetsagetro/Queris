name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'

      - name: Run repository hooks
        run: pre-commit run --all-files

      - name: Run unit tests
        run: python -m pytest

      - name: Run Phase 6/7 evaluation gate
        run: queris-ci-eval

      - name: Start containerized API
        env:
          QUERIS_DATABASE_PATH: /tmp/queris-ci-retail.duckdb
        run: |
          queris-sample-data "$QUERIS_DATABASE_PATH"
          docker compose up --build --detach --wait
          python -c "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); assert json.load(response) == {'status': 'ok', 'database_available': True}"

      - name: Stop containerized API
        if: always()
        env:
          QUERIS_DATABASE_PATH: /tmp/queris-ci-retail.duckdb
        run: docker compose down

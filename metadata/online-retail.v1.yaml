version: 1
reviewed: true
tables:
  - schema_name: main
    name: customers
    description: Customers identified by the source's anonymized customer identifier and country.
    business_terms: [customer, buyer]
    aliases: [customer base]
    columns:
      - name: customer_id
        description: Anonymized customer identifier supplied by the UCI source.
        aliases: [buyer id]
      - name: country
        description: Customer country recorded by the source.
        aliases: [market, geography]
  - schema_name: main
    name: order_items
    description: Product-level sales lines with quantity, unit price, and calculated line revenue.
    business_terms: [order line, sales line, transaction line]
    aliases: [line items]
    columns:
      - name: quantity
        description: Units recorded on the source line. Negative values can represent cancellations or returns.
        business_terms: [units, volume]
        unit: units
      - name: unit_price
        description: Price per unit in the source currency, pounds sterling.
        business_terms: [price, unit price]
        aliases: [selling price]
        unit: GBP
      - name: revenue
        description: Quantity multiplied by unit price for the source line.
        business_terms: [sales, turnover]
        aliases: [line revenue]
        unit: GBP
  - schema_name: main
    name: orders
    description: Invoices with transaction time, customer, country, and cancellation indicator.
    business_terms: [order, invoice, transaction]
    aliases: [sales orders]
    columns:
      - name: invoice_date
        description: Timestamp when the invoice was generated by the source retailer.
        aliases: [transaction date, order date]
        unit: timestamp
      - name: is_cancelled
        description: True when the source invoice number starts with C.
        business_terms: [cancelled order, return]
        aliases: [cancellation flag]
  - schema_name: main
    name: products
    description: Source product codes and descriptions from the online retail catalogue.
    business_terms: [product, item, SKU]
    aliases: [product catalogue]
    columns:
      - name: stock_code
        description: Source identifier for a distinct product or stock item.
        aliases: [SKU, item code]
      - name: description
        description: Source product description. Some operational records are not sellable products.
        aliases: [product name, item description]
